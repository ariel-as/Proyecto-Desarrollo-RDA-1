name: Verificación y publicación

# El sitio se valida en cada cambio y solo se publica si todo pasa.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Comprobaciones de calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Playwright se instala solo en el servidor de CI: el proyecto no declara
      # dependencias ni añade archivos de paquete al repositorio.
      - name: Instalar Playwright para las pruebas de navegador
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Sintaxis de JavaScript
        run: |
          fallos=0
          for archivo in $(git ls-files '*.js' '*.mjs'); do
            node --check "$archivo" || fallos=1
          done
          if [ "$fallos" -ne 0 ]; then exit 1; fi
          echo "Sintaxis correcta en $(git ls-files '*.js' '*.mjs' | wc -l) archivos"

      - name: HTML5 y semántica
        run: |
          codigo=0
          node pruebas/prueba-html.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Accesibilidad WCAG y ARIA
        run: |
          codigo=0
          node pruebas/prueba-accesibilidad.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Enlaces externos y rutas
        run: |
          codigo=0
          node pruebas/prueba-enlaces.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Lógica del carrito y planes
        run: |
          codigo=0
          node pruebas/prueba-logica.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Integridad de los datos
        run: |
          codigo=0
          node pruebas/prueba-repo.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Selectores del DOM
        run: |
          codigo=0
          node pruebas/prueba-selectores.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Recorrido completo en navegador
        run: |
          codigo=0
          node pruebas/prueba-navegador.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Diseño responsive y accesibilidad medida
        run: |
          codigo=0
          node pruebas/prueba-responsive.mjs > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

  desplegar:
    name: Publicar en GitHub Pages
    needs: verificar
    # La publicación solo ocurre con un push a la rama principal, nunca desde una
    # pull request ni desde una ejecución manual incompleta.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      # Falla aquí si Pages no está habilitado en el repositorio, de modo que no
      # se publica nada sin la configuración correcta.
      - name: Verificar la configuración de Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Copiar el repositorio
        uses: actions/checkout@v4

      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          cp index.html _sitio/
          for carpeta in admin assets cliente data js; do
            cp -r "$carpeta" _sitio/
          done
          echo "Archivos preparados: $(find _sitio -type f | wc -l)"

      # Última revisión antes de publicar: comprueba sobre la copia final que no
      # hay rutas rotas ni destinos inseguros.
      - name: Validar el sitio preparado
        run: |
          codigo=0
          node pruebas/prueba-enlaces.mjs _sitio > /tmp/salida.txt 2>&1 || codigo=$?
          cat /tmp/salida.txt
          grep '^FALLA' /tmp/salida.txt | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          exit $codigo

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4